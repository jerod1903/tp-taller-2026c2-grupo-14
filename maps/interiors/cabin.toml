format_version = 1
name = "Interior de la cabaña"

# La sala, igual en todos los mundos. Solo se marca el piso: las paredes las arma el juego alrededor
# (common/map/InteriorWalls.h), asi que arriba quedan cuatro filas para la pared del fondo. La
# columna 13 es la pared que la separa del cuarto de las camas, que el juego agrega a la derecha
# segun max_players (common/map/CabinInterior.h); su piso en la fila 9 es la puerta. Abajo sale el
# pasillo de entrada: su ultima
# casilla es la puerta, que lleva a la de la cabaña en la granja.
