format_version = 1
name = "Interior del centro comunitario"

# El centro comunitario, igual en todos los mundos. Solo se marca el piso: las paredes las arma el
# juego alrededor (common/map/InteriorWalls.h), asi que arriba quedan cuatro filas para la pared
# del fondo. Abajo sale el pasillo de entrada: su ultima casilla es la puerta, que lleva a la del
# centro comunitario en el pueblo. Hay un objeto por set, contra cada pared, donde se entrega: los
# cultivos y los metales en el fondo, los productos animales a la izquierda y el dinero a la
# derecha. El set de pelea no tiene objeto: se completa peleando.
