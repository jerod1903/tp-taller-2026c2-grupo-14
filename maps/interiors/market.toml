format_version = 1
name = "Interior del mercado"

# El mercado, igual en todos los mundos. Solo se marca el piso: las paredes las arma el juego
# alrededor (common/map/InteriorWalls.h), asi que arriba quedan cuatro filas para la pared del
# fondo. Abajo sale el pasillo de entrada: su ultima casilla es la puerta, que lleva a la del
# mercado en el pueblo. Pierre atiende detras del mostrador; los otros comerciantes andan por la
# tienda.
