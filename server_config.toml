# Valores del juego que ajusta el servidor. El cliente recibe lo que necesita por el protocolo.

[game]
max_players = 5
tick_rate = 30           # ticks por segundo
outbox_size = 64         # mensajes pendientes por jugador; con la outbox llena se descartan snapshots

[time]
day_speed = "rapido"      # "lento" (21 min reales por dia), "medio" (14) o "rapido" (7)

[player]
health = 100
energy = 100
gold = 500
speed = 4.0              # celdas por segundo
tired_energy = 0.1       # con esta fracción de su energía o menos camina a mitad de velocidad
bad_night_recovery = 0.5 # fracción de vida y energía con la que despierta si no durmió en su cama
sword_damage = 10        # vida que le saca a un enemigo cada golpe de espada
attack_cooldown = 0.5    # segundos entre golpe y golpe de espada
attack_time = 0.25       # segundos que se lo ve atacando después de cada golpe de espada
hurt_time = 0.4          # segundos que se lo ve herido después de recibir un golpe
weak_health = 0.2        # con esta fracción de su vida o menos pega menos
weak_damage = 0.5        # fracción de su daño que pega cuando está así de débil
gift_reach = 2.0         # hasta dónde llega para regalarle a otro jugador: de centro a centro, en casillas

[inventory]
max_stack = 50           # los objetos iguales se apilan en un slot del inventario hasta esta cantidad
chest_reach = 1.5        # hasta dónde llega el jugador para abrir un cofre: de su centro al del cofre, en casillas

[energy]                 # lo que cansa cada acción
dig = 2                  # cada golpe de pala
water = 2
plant = 1
harvest = 1
milk = 1
pick_up = 1              # levantar un huevo del piso
attack = 2               # cada golpe de espada
mine = 3                 # cada golpe de pico
talk = 1                 # hablar con un comerciante

# Provisorio: hasta que se compren a Marnie, la granja arranca con estos.
[animals]
cows = 2
chickens = 3
offset_x = -2            # donde arranca la fila de animales, respecto de donde aparece el jugador
offset_y = 3
health = 100
speed = 1.0              # celdas por segundo
min_walk = 1.0           # segundos que camina (o se queda quieto) antes de elegir otra direccion
max_walk = 3.0
milking_reach = 1.5      # hasta donde llega el jugador para ordeñar, en casillas

[animals.cow]
price = 80               # monedas de oro
product_price = 30       # la leche
max_per_farm = 5
production_days = 2      # da leche cada dos dias

[animals.chicken]
price = 20
product_price = 3        # el huevo
max_per_farm = 10
production_days = 1      # pone un huevo por dia

[enemies]
spawn_distance = 5.0     # al aparecer, ninguno queda a menos de estas casillas de un portal del nivel
min_walk = 1.0           # sin nadie a la vista deambulan: cambian de direccion cada min_walk a max_walk segundos
max_walk = 3.0

# Pelea cuerpo a cuerpo; al morir revive pasado un tiempo.
[enemies.skeleton]
count = 2                # cuantos aparecen en cada nivel
health = 30
damage = 5               # vida que le saca al jugador en cada golpe
speed = 2.5              # celdas por segundo
sight = 6.0              # hasta donde ve a un jugador, en casillas (no ve a traves de las paredes)
reach = 1.0              # hasta donde llega su golpe, de su centro al del jugador, en casillas
cooldown = 1.0           # segundos entre golpe y golpe
revive_seconds = 10.0    # cuanto tarda en revivir
# Monedas que suelta la primera vez que muere (al revivir no vuelve a soltar): con gold_chance de
# probabilidad, entre gold_min y gold_max. Se las lleva quien le dio el ultimo golpe. Van segun
# dificultad: esqueleto baja, orco media, vampiro alta.
gold_chance = 0.7
gold_min = 2
gold_max = 4

# Pelean cuerpo a cuerpo y aparecen en pareja: la vampira es mas rapida y el vampiro pega mas
# fuerte. Si muere uno, el otro duplica lo suyo. Muertos, reviven si cerca de ellos un jugador
# muere o queda gravemente herido (con weak_health de vida o menos).
[enemies.vampire]
pairs = 1                # cuantas parejas aparecen en cada nivel
health = 40
damage = 5
speed = 2.5              # la del vampiro
sight = 6.0
reach = 1.0
cooldown = 1.2
fast_speed = 3.0         # la de la vampira
strong_damage = 8        # el golpe del vampiro
revive_seconds = 5.0     # cuanto tardan en revivir despues de que cae sangre cerca
blood_reach = 3.0        # hasta cuantas casillas del cuerpo cuenta la sangre de un jugador
gold_chance = 0.9        # monedas que suelta la primera vez que muere
gold_min = 10
gold_max = 15

# Pelean cuerpo a cuerpo y aparecen en grupo, juntos; al morir no reviven.
[enemies.orc]
min_group = 3            # cuantos aparecen en el grupo: entre min_group y max_group
max_group = 6
health = 35
damage = 5
speed = 2.0
sight = 6.0
reach = 1.0
cooldown = 1.0
gold_chance = 0.8        # monedas que suelta al morir
gold_min = 5
gold_max = 8
silver_chance = 0.2      # deja plata (mineral) en el piso

# No se la puede matar: pelea a distancia, tirando llamas. Cada una tira siempre del mismo color,
# sorteado al aparecer.
[enemies.skull]
speed = 1.5
sight = 7.0
cooldown = 2.0           # segundos entre llama y llama
green_chance = 0.5       # probabilidad de que tire llamas verdes (si no, azules)

# Las llamas azules. Las verdes hacen el doble de daño y van a la mitad de velocidad.
[enemies.flame]
damage = 6
speed = 5.0              # celdas por segundo
range = 8.0              # celdas que recorre antes de apagarse

# Las trampas de la mazmorra: aparecen al azar en cada nivel cada vez que se repuebla. Se activan
# por tiempo: active_time segundos activas y idle_time inactivas. Activas, le sacan damage a cada
# jugador en su zona, una vez por activación.
[traps]
spikes_count = 3         # pinches por nivel
flamethrowers_count = 2  # lanzallamas por nivel

# Lastiman a quien esté parado en su celda
[traps.spikes]
damage = 5
active_time = 1.0
idle_time = 2.0

# Pegados a una pared, tiran un chorro de fuego para el otro lado
[traps.flamethrower]
damage = 8
active_time = 1.5
idle_time = 2.5
reach = 1                # celdas que alcanza el chorro, contando la suya (el dibujo llega a 1)

# Precios de semilla provisorios; los de cosecha y los días son los del enunciado.
[crops.strawberry]
seed_price = 10
base_price = 25
waterings_per_day = 2
days_to_grow = 4
regrow_days = 2           # después de la primera cosecha vuelve a dar cada 2 días
skippable_waterings = 0

[crops.scallion]
seed_price = 5
base_price = 12
waterings_per_day = 3
days_to_grow = 2
regrow_days = 0
skippable_waterings = 0

[crops.potato]
seed_price = 8
base_price = 18
waterings_per_day = 2
days_to_grow = 3
regrow_days = 0
skippable_waterings = 1   # tolera saltearse un riego por día

[crops.pumpkin]
seed_price = 20
base_price = 50
waterings_per_day = 1
days_to_grow = 7
regrow_days = 0
skippable_waterings = 0

# Calidad de la cosecha: puntaje = (riego * watering_weight + cosecha * (1 - watering_weight)) * suerte.
# Riego: 1 si se regó apenas lo necesitó, baja con la demora y cada riego salteado cuenta como 0.
# Cosecha: 1 si se cosechó apenas estuvo lista, llega a 0 a los harvest_grace_days días.
[crops.quality]
watering_weight = 0.5
harvest_grace_days = 2.0
luck_min = 0.8            # la suerte es un multiplicador al azar entre estos dos
luck_max = 1.2
good = 0.5                # puntaje mínimo de cada calidad; por debajo, base
excellent = 0.7
incredible = 0.85
perfect = 0.95

# Se escriben en el chat con un $ adelante y una cantidad opcional: "$gold 10".
[cheats]
seeds = 10                # cuántas semillas de cada tipo da "$seeds" sin cantidad
gold = 100                # cuánto oro da "$gold" sin cantidad

# Los comerciantes del mercado. Los precios de animales, leche, huevos, semillas y cosechas son los
# de [animals.*] y [crops.*]; lo que cansa hablarles, el "talk" de [energy].
[market]
reach = 2.5              # hasta donde se le habla a un comerciante, de centro a centro, en casillas
cow_buyback = 40         # lo que paga Marnie por una vaca (no puede superar su price)
chicken_buyback = 10
chest_price = 100        # lo que cobra Robin por un cofre (el enunciado no lo fija)


# Minería. Los golpes de pico salen de "tiempo hasta conseguir el material" del enunciado (poco,
# medio, alto, muy alto); la cantidad por nivel, de la frecuencia de aparición.
[mining]
ores_per_level = 3         # cuantos minerales aparecen en cada nivel
lapis_break_chance = 0.15  # al picarlo se rompe y no da producto
silver_orc_chance = 0.10   # al obtenerla se avecina una manada de orcos
gold_min_depth = 4         # el oro solo aparece desde la 5ta sala (el nivel de entrada es el 0)

[ores.coal]
hits = 1
price = 10                 # lo que paga Clint

[ores.lapis]
hits = 2
price = 40

[ores.silver]
hits = 3
price = 50

[ores.gold]
hits = 4
price = 80